name: release

# Pushing a vX.Y.Z tag builds every platform, publishes a GitHub release and,
# with the HOMEBREW_TAP_DEPLOY_KEY secret, updates the cask in Dikevin/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      # Keep the generated cask, so a failed tap push can be fixed by hand.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/*.rb
          if-no-files-found: ignore
